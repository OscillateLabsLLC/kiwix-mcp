[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiwix-mcp"
version = "1.4.1"
description = "MCP server and client library for Kiwix HTTP servers"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.26",
    "defusedxml>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "respx>=0.21"]
# Pins verified against the Neon Hub: opm 0.9.0 already exposes the modern
# (query, lang, units) solver signature. opm imports pkg_resources, which needs
# setuptools<81 on Python 3.12+.
ovos = [
    "ovos-plugin-manager>=0.9.0,<1.0.0",
    "ovos-utils>=0.3.0,<1.0.0",
    "setuptools<81",
]
# The skill targets the 0.x CommonQuerySkill contract, which differs from modern
# OVOS: `@common_query` does not exist before ovos-workshop 8.
skill = [
    "kiwix-mcp[ovos]",
    "ovos-workshop>=0.1.0,<1.0.0",
    "ovos-bus-client>=0.0.8,<2.0.0",
]

[project.scripts]
kiwix-mcp = "kiwix_mcp.__main__:main"
kiwix-client = "kiwix_client.cli:main"

# The loader group is still the legacy name at opm 0.9.0, which carries
# `TODO rename "opm.solver.question"`. Declaring both means the plugin keeps loading
# across that rename; the unused group is inert.
[project.entry-points."neon.plugin.solver"]
kiwix = "kiwix_ovos.solver:KiwixSolver"

[project.entry-points."opm.solver.question"]
kiwix = "kiwix_ovos.solver:KiwixSolver"

[project.entry-points."ovos.plugin.skill"]
"kiwix-mcp.oscillatelabsllc" = "kiwix_ovos.skill:KiwixSkill"

[tool.hatch.build.targets.wheel]
packages = ["kiwix_client", "kiwix_mcp", "kiwix_ovos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=kiwix_mcp --cov=kiwix_client --cov=kiwix_ovos --cov-report=term-missing"
